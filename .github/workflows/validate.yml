# Managed by ngx-workshop CLI. Policy v1; edit the central CLI profile, then run workflows --apply.
name: "Validate service-navigational-list"
on:
  workflow_call: {}
  workflow_dispatch: {}
permissions:
  contents: "read"
jobs:
  validate:
    permissions:
      contents: "read"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          persist-credentials: false
      - uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020"
        with:
          node-version: "22.23.5"
          package-manager-cache: false
      - run: "npm ci"
      - run: "npm run format:check"
      - run: "npm test -- --runInBand"
      - run: "npm run build"
        env:
          GENERATE_OPENAPI: "true"
      - run: "npm run lint:check"
      - name: "Build contracts"
        working-directory: "contracts/service-navigational-list"
        run: |
          npm ci
          npm run gen
          npm run build
    env:
      HUSKY: "0"
